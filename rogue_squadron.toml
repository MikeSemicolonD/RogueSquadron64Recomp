[input]
entrypoint = 0x80000400
elf_path = "../rogue_squadron64/build/roguesquadron.elf"
rom_file_path = "../rogue_squadron64/rogue_squadron.z64"
output_func_path = "RecompiledFuncs"

# The 3 overlays (.ovl.mission/menu/cinematic) share VA 0x800A5130 and swap at
# runtime; direct jal binds every call to one overlay at link time. Route all
# calls through func_map so the rs64_load_overlay hook points it at the live
# overlay. Runtime-provided libultra funcs still resolve to direct _recomp calls.
use_lookup_for_all_function_calls = true

# Dual-entry funcs: splat merged both entries into one, so the offset entry is
# missing from the symbol table. Re-register it standalone for get_function().
manual_funcs = [
    { name = "func_8008ED70", section = ".text", vram = 0x8008ED70, size = 0x150 },
]

# Size overrides. func_800E9AE0 (AT-PT/walker child health-init callback) ends in
# a blez to 0x800E9BD4 inside the next function; at its ELF size (0x30) that branch
# is out of bounds and the recompiler can't build it (was stubbed -> child spawned
# with 0 health -> AT-PTs invincible). Extend it to absorb func_800E9B10 (0xE4) so
# the branch is in-bounds. func_800E9B10 stays a standalone entry (called from
# 0x800B58B8), i.e. a dual-entry function.
function_sizes = [
    { name = "func_800E9AE0", size = 0x114 },
]

