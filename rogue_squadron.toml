# =============================================================================
# Host hooks. Every entry here calls into src/main/hook_helpers.cpp or
# upstream_compat.cpp; the inline KSEG0 guards that used to sit here are gone.
# =============================================================================

# Diagnostic hooks (ROGUESQ_LOG_HOOKS=1; silent otherwise). Helper rs64_dbg_log4
# in upstream_compat.cpp. NOTE: a hook body is inlined at function entry, so a
# bare `return` exits the WHOLE function — wrap logging in `if (s_log) {...}`.
# func_8003DFA0 = cinematic outer loop (gates: B40+0x04, B40+0x21, B50 bit5,
# B58 bit25); func_800A5D80 = inner loop (advances on a1==2 or B50 bit5).
[[patches.hook]]
func = "cinematicLoopBody"
text = '''{
    // Cinematic is running, so attribution is over: clear g_current_scene here
    // (the NTSC N64-logo branch that would clear it is skipped) or the
    // attribution VI redirect steals the cinematic's swaps.
    extern volatile int g_current_scene; g_current_scene = -1;

    // Periodic yield to break the cinematic thread-starvation stall.
    // ROGUESQ_DISABLE_CINE_YIELD=1 disables.
    extern void rs64_cine_yield(void);
    static int s_disable = -1;
    if (s_disable < 0) {
        const char* e = getenv("ROGUESQ_DISABLE_CINE_YIELD");
        s_disable = (e && *e && *e != '0') ? 1 : 0;
    }
    if (!s_disable) rs64_cine_yield();

    static int s_log = -1;
    if (s_log < 0) {
        const char* e = getenv("ROGUESQ_LOG_HOOKS");
        s_log = (e && *e && *e != '0') ? 1 : 0;
    }
    if (s_log) {
        static int s_count = 0;
        ++s_count;
        if (s_count <= 4 || (s_count & 63) == 0) {
            extern void rs64_dbg_log4(const char* tag, unsigned a, unsigned b, unsigned c, unsigned d);
            rs64_dbg_log4("800A5D80 a0 a1 a2 count", (unsigned)ctx->r4, (unsigned)ctx->r5, (unsigned)ctx->r6, (unsigned)s_count);
        }
    }
}'''

# Empty-pool sentinel for load_asset_with_malloc_flags. The audio walker
# func_80097518 reads an empty pool's first word as -1 = "no entries", but
# zero-init RAM leaves it 0 -> infinite walker loop. Stamp -1 at return (r2 =
# buffer). Load-bearing boot-deadlock fix. ROGUESQ_DISABLE_EMPTY_POOL_SENTINEL.
[[patches.hook]]
func = "load_asset_with_malloc_flags"
before_vram = 0x80064884   # the `jr $ra` instruction
text = '''{
    static int s_force = -1;
    if (s_force < 0) {
        const char* e = getenv("ROGUESQ_DISABLE_EMPTY_POOL_SENTINEL");
        s_force = (e && *e && *e != '0') ? 0 : 1;
    }
    if (s_force) {
        uint32_t buf_ptr = (uint32_t)ctx->r2;
        if (buf_ptr >= 0x80000000u && buf_ptr < 0x80800000u) {
            int32_t* word_ptr = (int32_t*)(rdram + (buf_ptr - 0x80000000u));
            if (*word_ptr == 0) {
                *word_ptr = -1;
            }
        }
    }
}'''

# Per-frame loop counter (blocks on the VI retrace queue each iter, so its rate
# = the real frame rate). Logs first 4 + every 64th iter.
[[patches.hook]]
func = "viRetraceHandlerThread"
before_vram = 0x800198E8   # L_800198E8 — top of per-frame loop
text = '''{
    static int s_count = 0;
    int n = ++s_count;
    if (n <= 4 || (n & 63) == 0) {
        extern void rs64_dbg_log4(const char* tag, unsigned a, unsigned b, unsigned c, unsigned d);
        rs64_dbg_log4("game_frame_iter", n, 0, 0, 0);
    }
    // All-displayed deadlock rescue: buffers all in state 5 with none in 1-4 is
    // an illegal steady state (5->0 demotion can't fire, producer can't alloc) =
    // the cinematic freeze. After it persists 32 consumer passes, demote the 5s
    // to 0. r22 = buffer-state base (0x80128EAC). ROGUESQ_BUFSTUCK_RESCUE=0 disables.
    {
        extern char* getenv(const char*);
        static int s_resc = -1; static int s_persist = 0; static unsigned s_rescued = 0;
        if (s_resc < 0) { const char* e = getenv("ROGUESQ_BUFSTUCK_RESCUE"); s_resc = (e && e[0] == '0') ? 0 : 1; }
        if (s_resc) {
            unsigned cnt = (unsigned)MEM_BU(ctx->r22, -0X1); if (cnt > 3) cnt = 3;
            int fives = 0, inflight = 0; unsigned k;
            for (k = 0; k < cnt; ++k) {
                unsigned st = (unsigned)MEM_BU(ctx->r22, -0X4 + (int)k);
                if (st == 5) ++fives; else if (st >= 1 && st <= 4) ++inflight;
            }
            if (cnt >= 2 && fives >= 2 && inflight == 0) {
                if (++s_persist >= 32) {
                    s_persist = 0; ++s_rescued;
                    for (k = 0; k < cnt; ++k)
                        if ((unsigned)MEM_BU(ctx->r22, -0X4 + (int)k) == 5) MEM_B(-0X4 + (int)k, ctx->r22) = 0;
                    {
                        extern void rs64_dbg_log4(const char* tag, unsigned a, unsigned b, unsigned c, unsigned d);
                        rs64_dbg_log4("bufstuck_rescue", s_rescued, 0, 0, 0);
                    }
                }
            } else { s_persist = 0; }
        }
    }
}'''

# RETIRED NOBLOCK experiments. VI-driven mode (default) runs the hardware
# protocol, where these recvs must BLOCK; the host osRecvMesg override applies
# NOBLOCK only when ROGUESQ_VI_DRIVEN_LOOP=0. Reverted sites (func @ vram):
#   submitGfxFrame @0x8000C4AC / @0x8000C2BC / @0x8000C0B8
#   bufferArbiterProducerScanWait @0x8000BFCC / @0x8000BF98
#   waitForPostSwapAck @0x8001C278   waitOnVideoQueue @0x8001BEA4
#   bufferArbiterProducerMark osRecvMesg(D_80128D10) — NOBLOCK didn't help;
#     needs host state-machine modeling, not an instruction patch.

