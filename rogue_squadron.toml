# =============================================================================
# Host hooks. Every entry here calls into src/game/hook_helpers.cpp or
# upstream_compat.cpp; the inline KSEG0 guards that used to sit here are gone.
# =============================================================================

# Diagnostic hooks (ROGUESQ_LOG_HOOKS=1; silent otherwise). Helper rs64_dbg_log4
# in upstream_compat.cpp. NOTE: a hook body is inlined at function entry, so a
# bare `return` exits the WHOLE function — wrap logging in `if (s_log) {...}`.
# func_8003DFA0 = cinematic outer loop (gates: B40+0x04, B40+0x21, B50 bit5,
# B58 bit25); func_800A5D80 = inner loop (advances on a1==2 or B50 bit5).
[[patches.hook]]
func = "cinematicLoopBody"
text = '{ rs64_th_cinematicLoopBody_entry(rdram, ctx); }'

# Empty-pool sentinel for load_asset_with_malloc_flags. The audio walker
# func_80097518 reads an empty pool's first word as -1 = "no entries", but
# zero-init RAM leaves it 0 -> infinite walker loop. Stamp -1 at return (r2 =
# buffer). Load-bearing boot-deadlock fix. ROGUESQ_DISABLE_EMPTY_POOL_SENTINEL.
[[patches.hook]]
func = "load_asset_with_malloc_flags"
before_vram = 0x80064884   # the `jr $ra` instruction
text = '{ rs64_th_load_asset_with_malloc_flags_80064884(rdram, ctx); }'

# Per-frame loop counter (blocks on the VI retrace queue each iter, so its rate
# = the real frame rate). Logs first 4 + every 64th iter.
[[patches.hook]]
func = "viRetraceHandlerThread"
before_vram = 0x800198E8   # L_800198E8 — top of per-frame loop
text = '{ rs64_th_viRetraceHandlerThread_800198E8(rdram, ctx); }'

# Game-state pause clock (ROGUESQ_PAUSE_AT, MCP pause_at/step) on screens without a menu or mission frame hook, such as the craft-select hangar.
[[patches.hook]]
func = "submitGfxFrame"
text = '{ rs64_th_submitGfxFrame_entry(rdram, ctx); }'

# Post-swap ack send NOBLOCK (`li $a2,1` -> `move $a2,$zero`): bufferArbiterAllocSlot leaves the ack flag 0x80037808 set, so a stale ack in the 1-slot queue blocked this send before musyxSynthFrame while the main thread spun on it (boot stall).
[[patches.instruction]]
func = "viRetraceHandlerThread"
vram = 0x80019B54
value = 0x00003021

# RETIRED NOBLOCK experiments. VI-driven mode (default) runs the hardware
# protocol, where these recvs must BLOCK; the host osRecvMesg override applies
# NOBLOCK only when ROGUESQ_VI_DRIVEN_LOOP=0. Reverted sites (func @ vram):
#   submitGfxFrame @0x8000C4AC / @0x8000C2BC / @0x8000C0B8
#   bufferArbiterProducerScanWait @0x8000BFCC / @0x8000BF98
#   waitForPostSwapAck @0x8001C278   waitOnVideoQueue @0x8001BEA4
#   bufferArbiterProducerMark osRecvMesg(D_80128D10) — NOBLOCK didn't help;
#     needs host state-machine modeling, not an instruction patch.

# waitForAnyAudioSlot busy-waits on func_8008E57C (never non-zero with stubbed
# audio). NOP the loop's beq.
[[patches.instruction]]
func = "waitForAnyAudioSlot"
vram = 0x800668CC
value = 0x00000000

# Same busy-wait pattern in menuOverlayInit (post-transition menu). NOP the beq.
[[patches.instruction]]
func = "menuOverlayInit"
vram = 0x800C593C
value = 0x00000000

# ROGUESQ_BOOT_TARGET=level:<id>[,craft] is now handled by the nav_sequencer (a state-gated
# menu drive) instead of poking mission-prep fields here -- the old field-poke reached mission
# PREP then bailed to attract (jumping the state machine). See nav_sequencer.cpp. No boot hook needed.

# dpInterruptHandlerThread gates forwarding to game queue D_8011A7E8 on flag
# 0x8011A89D, which never becomes 1 here -> game thread blocks forever. NOP the
# gate `beq` at 0x8001C3C4 so it always osSendMesg (delay-slot zeros a1 anyway).
[[patches.instruction]]
func = "dpInterruptHandlerThread"
vram = 0x8001C3C4
value = 0x00000000

# Attribution pacing (0x800C29F8). Default: yield through the N64 scheduler until
# the next VI, so the producer emits the full glyph set (fixes the white/partial-draw
# race + gives ~2s duration) without holding the run slot (a host sleep here
# deadlocked the frame-buffer arbiter). ROGUESQ_ATTRIB_HOLD_MS>0 forces the old fixed sleep instead
# (default 50ms; e.g. 300 for screenshotting); =0 disables both.
[[patches.hook]]
func = "runMenuModelViewerScreen"   # was func_800C28F0 (renamed in syms)
before_vram = 0x800C29F8
text = '{ rs64_th_runMenuModelViewerScreen_800C29F8(rdram, ctx); }'

