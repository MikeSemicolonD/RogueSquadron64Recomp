# convertMat3x4ToN64Mtx: NOP the 4 cache 0x0D at 0x80018D88-D94 so the rest
# (real FP work) still recompiles. It also uses the PIC return `jr $t9` (t9=ra
# at entry), which N64Recomp mis-emits as LOOKUP_FUNC; the patch below swaps it
# for `jr $ra`.
[[patches.instruction]]
func = "convertMat3x4ToN64Mtx"
vram = 0x80018D88
value = 0x00000000

[[patches.instruction]]
func = "convertMat3x4ToN64Mtx"
vram = 0x80018D8C
value = 0x00000000

[[patches.instruction]]
func = "convertMat3x4ToN64Mtx"
vram = 0x80018D90
value = 0x00000000

[[patches.instruction]]
func = "convertMat3x4ToN64Mtx"
vram = 0x80018D94
value = 0x00000000

# `jr $t9` -> `jr $ra` at 0x80018E58 (t9=ra at entry; only `jr $ra` is read as
# a function exit by N64Recomp).
[[patches.instruction]]
func = "convertMat3x4ToN64Mtx"
vram = 0x80018E58
value = 0x03E00008

