# dpInterruptHandlerThread gates forwarding to game queue D_8011A7E8 on flag
# 0x8011A89D, which never becomes 1 here -> game thread blocks forever. NOP the
# gate `beq` at 0x8001C3C4 so it always osSendMesg (delay-slot zeros a1 anyway).
[[patches.instruction]]
func = "dpInterruptHandlerThread"
vram = 0x8001C3C4
value = 0x00000000

# Attribution pacing (0x800C29F8). Default: yield through the N64 scheduler until
# the next VI, so the producer emits the full glyph set (fixes the white/partial-draw
# race + gives ~2s duration) without holding the run slot (a host sleep here
# deadlocked the frame-buffer arbiter). ROGUESQ_ATTRIB_HOLD_MS>0 forces the old fixed sleep instead
# (default 50ms; e.g. 300 for screenshotting); =0 disables both.
[[patches.hook]]
func = "runMenuModelViewerScreen"   # was func_800C28F0 (renamed in syms)
before_vram = 0x800C29F8
text = '''{
    static int s_ms = -1;
    if (s_ms < 0) { const char* e = getenv("ROGUESQ_ATTRIB_HOLD_MS"); s_ms = (e && *e) ? atoi(e) : 50; if (s_ms < 0) s_ms = 0; if (s_ms > 2000) s_ms = 2000; }
    static int s_log = -1;
    if (s_log < 0) { const char* e = getenv("ROGUESQ_LOG_HOOKS"); s_log = (e && *e && *e != '0') ? 1 : 0; }
    if (s_log) { static int n = 0; ++n; if (n <= 40) { extern void rs64_dbg_log4(const char*, unsigned, unsigned, unsigned, unsigned); rs64_dbg_log4("attrib_iter n f22x1k f24x1k", (unsigned)n, (unsigned)(ctx->f22.fl*1000.0f), (unsigned)(ctx->f24.fl*1000.0f), 0); } }
    static int s_force_sleep = -1;
    if (s_force_sleep < 0) { const char* e = getenv("ROGUESQ_ATTRIB_HOLD_MS"); s_force_sleep = (e && *e) ? 1 : 0; }
    if (s_force_sleep) { if (s_ms > 0) { extern void rs64_sleep_ms(unsigned); rs64_sleep_ms((unsigned)s_ms); } }
    else { extern void rs64_attrib_wait_vi_yield(uint8_t*, recomp_context*); rs64_attrib_wait_vi_yield(rdram, ctx); }
}'''

# tickFormatMessageWorker replies with a pointer to one stack buffer for every request.
# The host decodes faster than hardware, so queued replies alias and all read the last
# request id; the SELECT GAME medal/preview slots then never activate. Send each reply
# from its own ring slot. ROGUESQ_NO_FORMAT_REPLY_FIX=1 disables.
[[patches.hook]]
func = "tickFormatMessageWorker"
before_vram = 0x800B380C
text = '''{ extern uint32_t rs64_format_reply_slot(uint8_t*, recomp_context*, uint32_t); ctx->r6 = (gpr)(int32_t)rs64_format_reply_slot(rdram, ctx, (uint32_t)ctx->r6); }'''

