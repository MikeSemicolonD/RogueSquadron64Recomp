# musyxSynthFrame (0x8009123C) audio tick (viRetraceHandlerThread -> musyxSynthFrame, per VI)
# does an indirect call `jalr $v0` at 0x80091798 through the N64-RSP-mixer
# callback slot MEM_W[0x801499D0]. initN64RspMixer (-> initAudioSubsystem)
# writes a valid function (0x8001A058) into that slot, but on first boot the
# audio tick runs before initAudioSubsystem, so the slot holds uninitialized
# garbage (0x801F7910) -> LOOKUP_FUNC -> get_function abort (fatal, bypasses
# the SEH net).
#
# The valid callback IS needed (it drives RSP-task / DL submission — NOPing
# the call unconditionally dropped send_dl from 64 to 2). So: NOP the jalr
# and re-issue the call from a hook ONLY when the slot holds a plausible
# recompiled-code address. The pre-init garbage (0x801F7910, past all code)
# is skipped; the real callback (0x8001A058) still runs.
[[patches.instruction]]
func = "musyxSynthFrame"
vram = 0x80091798
value = 0x00000000
[[patches.hook]]
func = "musyxSynthFrame"
before_vram = 0x80091798
text = '{ rs64_th_musyxSynthFrame_80091798(rdram, ctx); }'

