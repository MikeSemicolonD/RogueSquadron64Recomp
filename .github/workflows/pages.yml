name: Deploy site to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - favicon.ico
      - screenshots/Capture*.png
      - tools/web/**
      - src/video/default_lights.json
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Sparse, no submodules: the site keeps the repo's paths so existing links still work.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /index.html
            /favicon.ico
            /screenshots/Capture*.png
            /tools/web/
          sparse-checkout-cone-mode: false

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
