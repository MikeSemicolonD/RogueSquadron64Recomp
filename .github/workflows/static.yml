# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/web/site-version.txt

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/web/rs64-explorer
            tools/web/save-editor
            tools/web/site-version.txt
          sparse-checkout-cone-mode: false

      - name: Assemble site
        run: |
          mkdir -p _site/save-editor
          cp tools/web/rs64-explorer/index.html tools/web/rs64-explorer/style.css tools/web/rs64-explorer/*.js _site/
          cp tools/web/save-editor/rs64_save_editor.html _site/save-editor/index.html
          cp tools/web/save-editor/style.css tools/web/save-editor/save_editor.js _site/save-editor/
          cp tools/web/site-version.txt _site/version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
