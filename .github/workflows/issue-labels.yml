name: Label issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Issue forms render each dropdown as "### <label>\n\n<choices joined by ', '>"; a choice that starts with a repo label's name gets that label.
            const body = context.payload.issue.body || '';
            const m = body.match(/^### (?:Issue type|Kind)\s+(.+)$/m);

            // The parentheticals in the options contain commas of their own.
            const choices = m ? m[1].replace(/\([^)]*\)/g, '').split(',').map(c => c.trim().toLowerCase()) : [];
            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, context.repo);
            const add = [];

            for (const choice of choices) {
              const hit = labels
                .filter(l => choice.startsWith(l.name.toLowerCase()))
                .sort((a, b) => b.name.length - a.name.length)[0];

              if (hit && !add.includes(hit.name))
                add.push(hit.name);
            }

            // The question form's labels field is skipped if the label is missing; addLabels creates it.
            if (/^### Question\s/m.test(body))
              add.push('question');

            if (add.length) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels: add,
              });
            }
