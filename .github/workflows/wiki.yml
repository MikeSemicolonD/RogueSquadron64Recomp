name: Sync wiki

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/wiki/**
      - .github/workflows/wiki.yml

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/wiki

      # The wiki repo exists only after its first page is created on GitHub.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Mirror docs/wiki into the wiki
        env:
          # true puts _Notice.md under the title of every page
          WIP_NOTICE: true
        run: |
          rsync -a --delete --exclude .git --exclude _Notice.md docs/wiki/ wiki/

          if [ "$WIP_NOTICE" = true ]; then
            for f in wiki/*.md; do
              case "$(basename "$f")" in _*) continue ;; esac
              awk -v notice=docs/wiki/_Notice.md 'NR == 1 && /^# / { print; print ""; while ((getline l < notice) > 0) print l; next } { print }' "$f" > "$f.tmp"
              mv "$f.tmp" "$f"
            done
          fi

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi

          git commit -m "Sync from ${GITHUB_SHA::7}"
          git push
