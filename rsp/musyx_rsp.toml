rom_file_path = "../rogue_squadron.z64"
text_offset = 0x9ABE0
text_size = 0xF80  # main ucode = 0xF80 bytes; boot DMAs it to IMEM 0x80 (fills IMEM 0x80..0xFFF)
text_address = 0x04001080  # boot ucode (0xD0B @ 0x800825D0) DMAs main text to IMEM 0x80 (jr 0x1080), NOT IMEM 0 — verified via [imemdma] dst=0x1080
output_file_path = "../build/factor5_ucode/musyx_audio_recompiled.c"
output_function_name = "musyx_audio"

# MusyX uses jr-through-data dispatch tables (like the GFX ucode); RSPRecomp
# can't see those targets. Extracted from musyx_data.bin: 4-aligned halfwords
# in the IMEM code range [0x1000,0x1F80] that aren't already auto-detected
# (two parallel tables at DMEM ~0x04-0x84 and ~0x1ba-0x33e = command handlers).
extra_indirect_branch_targets = [
    0x10B4, 0x10E8, 0x10F0, 0x1100,
    0x131C, 0x1338, 0x1354, 0x13A4, 0x13C0, 0x148C, 0x1600, 0x1628,
    0x16E4, 0x1708, 0x1780, 0x1800, 0x183C, 0x18DC, 0x1914, 0x19B8,
    0x19F8, 0x1A44, 0x1A4C, 0x1B60, 0x1C6C, 0x1C7C, 0x1D6C, 0x1E60,
    0x1ED0, 0x1EE8, 0x1F00, 0x1F40, 0x1F80
]
