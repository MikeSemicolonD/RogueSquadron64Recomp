<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rogue Squadron 64 Recompiled</title>
<link rel="icon" href="favicon.ico">
<script src="coi-serviceworker.js"></script>
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #e8e4d8; --dim: #8a8f96; --bad: #e06c5f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  #canvas { display: block; width: 100%; height: 100%; }
  #panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; }
  #panel[hidden] { display: none; }
  #status { color: var(--dim); max-width: 36em; white-space: pre-line; }
  #status.bad { color: var(--bad); }
  label.pick { padding: 10px 18px; border: 1px solid #444; border-radius: 6px; cursor: pointer; }
  input[type=file] { display: none; }
  #bar { width: min(320px, 80vw); accent-color: #e8b84a; }
  #bar[hidden] { display: none; }
  #gear { position: fixed; top: 8px; right: 8px; width: 32px; height: 32px; padding: 6px; border: 0; border-radius: 6px; background: rgba(0, 0, 0, 0.45); color: var(--fg); opacity: 0.5; cursor: pointer; }
  #gear:hover, #gear[aria-expanded=true] { opacity: 1; }
  #gear[hidden], #settings[hidden] { display: none; }
  #settings { position: fixed; top: 48px; right: 8px; display: grid; grid-template-columns: auto auto; gap: 8px 12px; align-items: center; padding: 12px; border: 1px solid #444; border-radius: 6px; background: rgba(10, 10, 12, 0.92); }
  #settings select, #settings button { font: inherit; color: var(--fg); background: #1c1d21; border: 1px solid #444; border-radius: 4px; padding: 3px 6px; }
  #settings button { grid-column: 1 / 3; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<button id="gear" title="Settings" aria-expanded="false" hidden>
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>
<div id="settings" hidden>
  <label for="res">Resolution</label>
  <select id="res"><option value="1">Original</option><option value="2">2x</option><option value="auto">Window</option></select>
  <label for="terrain">Terrain detail</label>
  <select id="terrain"><option value="1">Low</option><option value="2">Medium</option><option value="4">High</option></select>
  <label for="fps">Frame rate</label>
  <select id="fps"><option value="30">30</option><option value="60">60</option></select>
  <button id="apply">Apply and restart</button>
</div>
<div id="panel">
  <div id="status">Loading</div>
  <progress id="bar" hidden></progress>
  <label class="pick" id="pick" hidden>Choose your ROM<input type="file" id="rom" accept=".z64,.n64,.v64"></label>
</div>
<script>
const ROM_PATH = '/persist/rogue_squadron.z64';
const panel = document.getElementById('panel');
const status = document.getElementById('status');
const pick = document.getElementById('pick');
const bar = document.getElementById('bar');

function say(text, bad)
{
  status.textContent = text;
  status.className = bad ? 'bad' : '';
}

// A determinate bar when the total is known, an indeterminate one otherwise; null hides it.
function progress(done, total)
{
  bar.hidden = done === null;

  if (total) {
    bar.max = total;
    bar.value = done;
  } else {
    bar.removeAttribute('value');
  }
}

function mb(bytes)
{
  return (bytes / 1048576).toFixed(1);
}

// Reads a stream in chunks so the bar can follow it. total is a guess when the server compresses (Content-Length is then the compressed size).
async function readAll(stream, total, label)
{
  const reader = stream.getReader();
  const chunks = [];
  let done = 0;

  for (;;) {
    const { value, done: end } = await reader.read();

    if (end)
      break;

    chunks.push(value);
    done += value.length;
    say(`${label} ${mb(done)} MB`);
    progress(Math.min(done, total), total);
  }

  const out = new Uint8Array(done);
  let at = 0;

  for (const c of chunks) {
    out.set(c, at);
    at += c.length;
  }

  return out;
}

function envFromQuery()
{
  const env = {};
  const q = new URLSearchParams(location.search).get('env');

  if (!q)
    return env;

  for (const pair of q.split(';')) {
    const i = pair.indexOf('=');

    if (i > 0)
      env[pair.slice(0, i)] = pair.slice(i + 1);
  }

  return env;
}

function sync(populate)
{
  return new Promise(resolve => Module.FS.syncfs(populate, () => resolve()));
}

let mainRan = false;
let tintReady = null;

// The game converts its shaders through rs64tint on this thread (Module.rs64Tint).
function loadTint()
{
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');

    s.src = 'rs64tint.js';
    s.onload = () => rs64Tint().then(tint => {
      Module.rs64Tint = tint;
      resolve();
    }, reject);
    s.onerror = () => reject(new Error('the shader converter didn\'t load'));
    document.head.append(s);
  });
}

// The renderer draws at the canvas's own size and follows it when it changes.
function fitCanvas()
{
  const c = Module.canvas;
  const dpr = window.devicePixelRatio || 1;

  c.width = Math.max(1, Math.round(c.clientWidth * dpr));
  c.height = Math.max(1, Math.round(c.clientHeight * dpr));
}

async function start()
{
  fitCanvas();
  window.addEventListener('resize', fitCanvas);
  progress(0, 0);
  say('Starting');

  try {
    await tintReady;
  } catch (e) {
    progress(null);
    say(`The game failed to load (${e.message}). Reload the page to try again.`, true);
    return;
  }

  progress(null);
  panel.hidden = true;
  gear.hidden = false;
  mainRan = true;
  Module.callMain([]);

  // The game keeps converted shaders and saves in /persist; this writes them back to the browser's storage.
  setInterval(() => sync(false), 15000);
  window.addEventListener('pagehide', () => sync(false));
}

const canvas = document.getElementById('canvas');

// Browsers lock the mouse only for a click: a click locks it while the game steers with it (not on menus); Escape or Alt+Tab
// gives it back and the game pauses a mission. Phones go fullscreen on the first tap instead.
canvas.addEventListener('click', () => {
  if (matchMedia('(pointer: coarse)').matches)
  {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen)
      document.documentElement.requestFullscreen().catch(() => {});

    return;
  }

  if (Module.rs64WantsMouse && document.pointerLockElement !== canvas)
    canvas.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  if (Module._rs64_web_pointer_lock_changed)
    Module._rs64_web_pointer_lock_changed(document.pointerLockElement === canvas ? 1 : 0);
});

const VIDEO_PATH = '/persist/roguesq_video.json';
const gear = document.getElementById('gear');
const settings = document.getElementById('settings');
const settingFields = {
  resolutionScale: document.getElementById('res'),
  terrainTessellation: document.getElementById('terrain'),
  targetFramerate: document.getElementById('fps')
};

function readVideo()
{
  try {
    return JSON.parse(Module.FS.readFile(VIDEO_PATH, { encoding: 'utf8' }));
  } catch (e) {
    return {};
  }
}

gear.addEventListener('click', () => {
  const open = settings.hidden;

  if (open)
  {
    const video = readVideo();

    for (const [key, field] of Object.entries(settingFields))
      field.value = String(video[key] ?? field.value);
  }

  settings.hidden = !open;
  gear.setAttribute('aria-expanded', String(open));
});

// The game reads its video settings at start, so a change saves them and restarts the page.
document.getElementById('apply').addEventListener('click', async () => {
  const video = readVideo();

  for (const [key, field] of Object.entries(settingFields))
    video[key] = field.value === 'auto' ? 'auto' : Number(field.value);

  Module.FS.writeFile(VIDEO_PATH, JSON.stringify(video, null, 2));
  await sync(false);
  location.reload();
});

// Called by the game when the stored file isn't the ROM: it has deleted the file and returned from main.
async function romRejected(text)
{
  await sync(false);
  say(text + 'Choose your Star Wars: Rogue Squadron (USA v1.0) N64 ROM.', true);
  panel.hidden = false;
  pick.hidden = false;
}

async function onRuntimeReady()
{
  Module.FS.mkdir('/persist');
  Module.FS.mount(Module.IDBFS, {}, '/persist');
  await sync(true);

  if (Module.FS.analyzePath(ROM_PATH).exists) {
    start();
    return;
  }

  progress(null);
  say('This needs your Star Wars: Rogue Squadron (USA v1.0) N64 ROM.\nIt stays in this browser.');
  pick.hidden = false;
}

document.getElementById('rom').addEventListener('change', async e => {
  const file = e.target.files[0];

  if (!file)
    return;

  pick.hidden = true;
  Module.FS.writeFile(ROM_PATH, await readAll(file.stream(), file.size, 'Reading your ROM'));
  say('Saving it in this browser');
  progress(0, 0);
  await sync(false);

  // main runs once per page load, so a second pick starts over from the stored file.
  if (mainRan)
    location.reload();
  else
    start();
});

var Module = {
  canvas: document.getElementById('canvas'),
  preRun: [() => Object.assign(Module.ENV, envFromQuery())],
  onRuntimeInitialized: onRuntimeReady,
  // The game download is the slow part of a first visit; fetching it here shows its progress (the service worker caches it after).
  instantiateWasm: (imports, ready) => {
    fetch('RogueSquadron64Recomp.wasm')
      .then(r => {
        if (!r.ok)
          throw new Error(`the game file answered ${r.status}`);

        return r;
      })
      .then(r => readAll(r.body, Number(r.headers.get('Content-Length')) || 0, 'Downloading the game'))
      .then(bytes => {
        say('Starting');
        progress(0, 0);
        return WebAssembly.instantiate(bytes, imports);
      })
      .then(r => ready(r.instance, r.module))
      .catch(e => {
        progress(null);
        say(`The game failed to load (${e.message}). Reload the page to try again.`, true);
      });
    return {};
  },
  romRejected,
  print: text => console.log(text),
  printErr: text => console.warn(text)
};

const unsupported = 'This browser can\'t run the game here. Try a current Chrome, Edge or Safari.';

// A first visit isn't isolated until the service worker controls the page; coi-serviceworker can miss its own reload, so reload once here.
if (!window.crossOriginIsolated && navigator.serviceWorker && !sessionStorage.getItem('rs64IsolationReload')) {
  sessionStorage.setItem('rs64IsolationReload', '1');
  navigator.serviceWorker.ready.then(() => location.reload());
  setTimeout(() => say(unsupported, true), 10000);
} else if (!window.crossOriginIsolated || typeof SharedArrayBuffer === 'undefined' || !navigator.gpu) {
  say(unsupported, true);
} else {
  sessionStorage.removeItem('rs64IsolationReload');
  tintReady = loadTint();

  const s = document.createElement('script');

  s.src = 'RogueSquadron64Recomp.js';
  document.body.append(s);
}
</script>
</body>
</html>
