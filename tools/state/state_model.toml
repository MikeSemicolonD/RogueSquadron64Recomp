[[state]]
id = "mission"
name = "In-mission (player)"
parent = ""
classify = [
  { addr = 0x80130B17, mask = 0xFF000000, op = "ne",   value = 0x00000000 },   # numMissionObjectives != 0
  { addr = 0x80130B50, mask = 0x00000020, op = "flag", value = 0x00000000 },   # gGameSettings+0x10 bit0x20 (demo) clear
]
force = { slot = "boot_level", params = { level = 0, craft = -1 } }
reachable_from = ["menu", "cinematic"]
focus = ["gMissionState", "gGameSettings", "gNpcSlotList..free"]

[[state]]
id = "attract.demo"
name = "Attract demo"
parent = ""
classify = [
  { addr = 0x80130B17, mask = 0xFF000000, op = "ne",   value = 0x00000000 },   # gameplay active (objectives set)
  { addr = 0x80130B50, mask = 0x00000020, op = "flag", value = 0x00000020 },   # demo bit set
]
force = { slot = "demo", params = { demo = 0 } }
reachable_from = ["menu"]
focus = ["gMissionState", "gGameSettings"]

