  { addr = 0x800CFF50, mask = 0xFFFF0000, op = "eq", value = 0x000A0000 },
]
focus = ["gCurrentMenuData"]

# CONCERT HALL music player (menu id 11, needs MAESTRO), on the SHOWROOM's screen. AT THE MOVIES has no page: it plays the cutscenes in a row as "cinematic" (screen 0x0C).
[[state]]
id = "menu.concert_hall"
name = "Concert Hall (music player)"
parent = "menu"
classify = [
  { addr = 0x800375B0, mask = 0xFFFFFFFF, op = "eq", value = 0x00000001 },
  { addr = 0x800CE730, mask = 0xFFFFFFFF, op = "range", value = 0x80000000, value_hi = 0x9FFFFFFF },
  { addr = 0x800CE734, mask = 0xFF000000, op = "eq", value = 0x0B000000 },
  { addr = 0x800CFF50, mask = 0xFFFF0000, op = "eq", value = 0x000A0000 },
]
focus = ["gCurrentMenuData"]

[[state]]
id = "mission"
name = "In-mission (player)"
parent = ""
classify = [
  { addr = 0x80130B17, mask = 0xFF000000, op = "ne",   value = 0x00000000 },   # numMissionObjectives != 0 (stale after a mission ends)
  { addr = 0x80130B50, mask = 0x00000020, op = "flag", value = 0x00000000 },   # gGameSettings+0x10 bit0x20 (demo) clear
  { addr = 0x800375B0, mask = 0xFFFFFFFF, op = "eq",   value = 0x00000000 },   # mission overlay loaded
]
force = { slot = "boot_level", params = { level = 0, craft = -1 } }
reachable_from = ["menu", "cinematic"]
focus = ["gMissionState", "gGameSettings", "gNpcSlotList..free"]

# CHICKEN (level 20) sets no objectives. Top level so a resident menu or cinematic, listed earlier, wins the tie; the id keeps it on the "mission" pause clock.
[[state]]
id = "mission.atst"
name = "In-mission (player AT-ST)"
parent = ""
classify = [
  { addr = 0x80130B17, mask = 0xFF000000, op = "eq", value = 0x00000000 },   # numMissionObjectives == 0
  { addr = 0x80130B70, mask = 0xFFFFFFFF, op = "eq", value = 0x00000014 },   # gCurrentLevel == CHICKEN
  { addr = 0x800375B0, mask = 0xFFFFFFFF, op = "eq", value = 0x00000000 },   # mission overlay loaded
]
focus = ["gMissionState", "gGameSettings"]

[[state]]
id = "attract.demo"
name = "Attract demo"
parent = ""
classify = [
  { addr = 0x80130B17, mask = 0xFF000000, op = "ne",   value = 0x00000000 },   # gameplay active (objectives set)
  { addr = 0x80130B50, mask = 0x00000020, op = "flag", value = 0x00000020 },   # demo bit set
  { addr = 0x800375B0, mask = 0xFFFFFFFF, op = "eq",   value = 0x00000000 },   # mission overlay loaded
]
force = { slot = "demo", params = { demo = 0 } }
reachable_from = ["menu"]
focus = ["gMissionState", "gGameSettings"]

# NOTE: front-menu tree via menu id 0x800CE734; pilot flow sub-steps via bridgeMenuState 0x800CDAC4
