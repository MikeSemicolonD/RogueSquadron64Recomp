# Canonical game-state model. Single source of truth for classification, forcing,
# and validation. Consumed by tools/state/gen_state_table.cpp (-> src/game/state_table.inl, at build time)
# and read directly by the Python validation tools. USA v1.0 addresses only.
#
# classify predicate op: eq | ne | range (value..value_hi) | flag ((mem & mask) == value).
# The host reads a big-endian u32 starting at `addr`; use mask to isolate a byte lane
# (byte field at address A: addr=A, mask=0xFF000000, value=byteval<<24).
#
# Predicates below are calibrated against a live in-mission RDRAM capture + the boot trace
# Struct fields per docs/reference/data-structures.md:
#   gGameSettings @0x80130B40: +0x00 currentLevel(u8), +0x01 vehicleId(u8), +0x10 flags(u32; bit0x20=demo active)
#   gMissionState @0x80130B10: +0x00 numLives(u8), +0x07 numMissionObjectives(u8)
#   gCurrentCutsceneFile ptr @0x800B1904 (valid KSEG0 only while a cutscene is loaded)

[[state]]
id = "cinematic"
name = "Cinematic / cutscene"
parent = ""
# An active cinematic state machine: the cinematic overlay is loaded (u32 0x800375B0: 0 mission, 1 menu, 2 cinematic) and cineStatePtr (0x800B0934) is a valid KSEG0 pointer.
# (gCurrentCutsceneFile is NOT used -- it is also valid behind the main menu's background.)
classify = [
  { addr = 0x800375B0, mask = 0xFFFFFFFF, op = "eq", value = 0x00000002 },
  { addr = 0x800B0934, mask = 0xFFFFFFFF, op = "range", value = 0x80000000, value_hi = 0x807FFFFF },
]
focus = ["cineStatePtr", "gCurrentCutsceneFile", "gateCtr"]

[[state]]
id = "menu"
name = "Front-end menu"
parent = ""
# A menu is resident: the menu overlay is loaded and gCurrentMenuData's first field (0x800CE730, the title) points into RDRAM; host-built titles (pages, title overrides) live above 8 MB.
# gCurrentMenuData sits in overlay memory, so with the cinematic or mission overlay loaded (the boot intro, a mission's opening cutscene) its bytes are stale or code.
classify = [
  { addr = 0x800375B0, mask = 0xFFFFFFFF, op = "eq", value = 0x00000001 },
  { addr = 0x800CE730, mask = 0xFFFFFFFF, op = "range", value = 0x80000000, value_hi = 0x9FFFFFFF },
]
reachable_from = ["cinematic", "menu"]
focus = ["gCurrentMenuData", "gGameSettings"]

# Front-end menu sub-pages: menu id at gCurrentMenuData+0x04 (0x800CE734, u8), enum from
# src/game/menus/menu_config.cpp FrontMenu. Each also requires the menu pointer-valid guard so it
# can't match at boot (where the field is 0 == MENU_MAIN). Children (depth 1) beat the
# "menu" parent when matched.

[[state]]
id = "menu.main"
name = "Main menu"
parent = "menu"
classify = [
  { addr = 0x800375B0, mask = 0xFFFFFFFF, op = "eq", value = 0x00000001 },
  { addr = 0x800CE730, mask = 0xFFFFFFFF, op = "range", value = 0x80000000, value_hi = 0x9FFFFFFF },
  { addr = 0x800CE734, mask = 0xFF000000, op = "eq", value = 0x00000000 },
  { addr = 0x800CFF50, mask = 0xFFFF0000, op = "eq", value = 0x00020000 },
]
focus = ["gCurrentMenuData"]

# State ids name the screen, one level under "menu"; how deep a screen sits in the game's menus is not part of the id (the MCP menu tool tracks the path).
# Menu pages are on the menu tree screen (0x800CFF50 = 2), SELECT LEVEL (with its AVAILABLE CRAFT panel) on screen 1 and the hangar on 0, which keeps the siblings apart.
# SELECT GAME and ENTER NAME (menu id 1) on the menu tree screen (0x800CFF50 = 2). 0x800CE626 looked like a sub-step but is a frame counter's high byte.
# SELECT LEVEL, AVAILABLE CRAFT and the hangar keep menu id 1; bridgeMenuState (u8 0x800CDAC4: 4 SELECT GAME and the hangar, 2 SELECT LEVEL, 3 AVAILABLE CRAFT) and the screen tell them apart.
# After a mission the menu data is zero (menuId 0), so SELECT LEVEL and AVAILABLE CRAFT key on the loaded overlay (u32 0x800375B0: 0 mission, 1 menu, 2 cinematic) instead of the menu ptr.
[[state]]
id = "menu.select_game"
name = "Select game / enter name"
parent = "menu"
classify = [
  { addr = 0x800375B0, mask = 0xFFFFFFFF, op = "eq", value = 0x00000001 },
  { addr = 0x800CE730, mask = 0xFFFFFFFF, op = "range", value = 0x80000000, value_hi = 0x9FFFFFFF },
  { addr = 0x800CE734, mask = 0xFF000000, op = "eq", value = 0x01000000 },
  { addr = 0x800CFF50, mask = 0xFFFF0000, op = "eq", value = 0x00020000 },
]
focus = ["gCurrentMenuData", "gGameSettings"]

[[state]]
# Level select, craft select and the hangar run in the mission-select overlay (0x800375B0 = 1), where the menu id byte keeps the last menu page shown (MULTIPLAYER in co-op), so it is not checked.
id = "menu.level_select"
name = "Select level"
parent = "menu"
# The SELECT LEVEL screen (0x800CFF50 = 1) before bridgeMenuState reaches 2 (it is 0 for a few frames after a pilot is picked) counts too, and so does the
# picked level's AVAILABLE CRAFT panel (bridgeMenuState 3): the craft is chosen in the hangar.
classify = [
  { addr = 0x800375B0, mask = 0xFFFFFFFF, op = "eq", value = 0x00000001 },
  { addr = 0x800CFF50, mask = 0xFFFF0000, op = "eq", value = 0x00010000 },
  { addr = 0x800CDAC4, mask = 0xFF000000, op = "ne", value = 0x04000000 },
]
focus = ["gCurrentMenuData", "gGameSettings"]

# The 3D SELECT YOUR CRAFT hangar keeps SELECT GAME's bridgeMenuState 4; the menu overlay's screen u16 (0x800CFF50: 2 menu tree, 1 SELECT LEVEL, 0 hangar) tells it apart.
# Its way in (screen still 1) and out to the mission's opening cutscene (screen 0x0B) count as the hangar.
[[state]]
id = "menu.hangar"
name = "Craft-select hangar"
parent = "menu"
classify = [
  { addr = 0x800375B0, mask = 0xFFFFFFFF, op = "eq", value = 0x00000001 },
  { addr = 0x800CDAC4, mask = 0xFF000000, op = "eq", value = 0x04000000 },
  { addr = 0x800CFF50, mask = 0xFFFF0000, op = "ne", value = 0x00020000 },
  { addr = 0x800CFF50, mask = 0xFFFF0000, op = "ne", value = 0x00030000 },
  { addr = 0x800CFF50, mask = 0xFFFF0000, op = "ne", value = 0x000A0000 },
]
focus = ["gCurrentMenuData", "gGameSettings"]

# The results screen after a mission (screen 3), where the menu data is cleared and bridgeMenuState keeps its pre-mission value.
[[state]]
id = "menu.results"
name = "Mission results"
parent = "menu"
classify = [
  { addr = 0x800375B0, mask = 0xFFFFFFFF, op = "eq", value = 0x00000001 },
  { addr = 0x800CFF50, mask = 0xFFFF0000, op = "eq", value = 0x00030000 },
]
focus = ["gGameSettings"]

