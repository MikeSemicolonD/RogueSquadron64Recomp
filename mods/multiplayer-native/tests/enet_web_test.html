<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>enet_web_test</title>
</head>
<body>
<pre id="out">running</pre>
<script>
const outEl = document.getElementById('out');
const query = new URLSearchParams(location.search);

function log(text)
{
  outEl.textContent += '\n' + text;
}

window.Module = {
  arguments: [query.get('port') || '', query.get('hash') || ''],
  print: log,
  printErr: log,
  onAbort: reason => log('ABORT ' + reason)
};

const s = document.createElement('script');

s.src = 'enet_web_test.js';
document.body.append(s);
</script>
</body>
</html>
