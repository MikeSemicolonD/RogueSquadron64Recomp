# Online co-op for two players. RecompModTool writes this mod's mod.json and instruction_patches.json from this file at build time (CMakeLists.txt).
[manifest]
id = "multiplayer_native"
version = "1.0.0"
display_name = "Multiplayer"
description = "Online co-op for two players: a MULTIPLAYER page on the main menu to host or join a game (LAN discovery, UPnP for internet play)."
short_description = "Online co-op for two players."
authors = ["RogueSquadron64Recomp"]
game_id = "rs64"
minimum_recomp_version = "0.0.0"
enabled_by_default = true
native_libraries = [ { name = "multiplayer_native", funcs = [ "rs64_mod_init" ] } ]

[inputs]
mod_filename = "multiplayer_native"
func_reference_syms_file = "../../syms/rogue_squadron.syms.toml"

# Per-player data relocation: each lui that addresses one of the four moved per-player ranges (kMovedRanges in src/mp_core.h) now addresses its host-RAM copy.
# Generated by tools/gen_relocation.py, which rewrites everything below this line; ambiguous sites are settled in tools/relocation_resolve.txt.

