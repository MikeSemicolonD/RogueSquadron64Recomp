# Laser bolts (audioCueDispatcherNpcHandler) get a lifetime at spawn: 1.5 s (rodata 0x8003AFD8), or 1.875 s (0x8003AFDC) when fired by the player.
# Past it the bolt shrinks 0.2 a frame and is freed. Each lui/lwc1 rodata load becomes lui/mtc1 of an immediate float, doubling both.
[manifest]
id = "long_lasers"
version = "1.0.0"
display_name = "Long Lasers"
description = "Laser bolts fly twice as long before fading out, so they reach twice as far: 3.75 s for your craft, 3 s for everyone else. Missiles and torpedoes are unchanged."
short_description = "Laser bolts fly twice as far."
authors = ["RogueSquadron64Recomp"]
game_id = "rs64"
minimum_recomp_version = "0.0.0"
enabled_by_default = false

[inputs]
mod_filename = "long_lasers"
func_reference_syms_file = "../../syms/rogue_squadron.syms.toml"

# Default lifetime 1.5 -> 3.0 (0x40400000).
[[patches.instruction]]
func = "audioCueDispatcherNpcHandler"
vram = 0x8005CAF0
expect_asm = "lui $at, 0x8004"
asm = "lui $at, 0x4040"

[[patches.instruction]]
func = "audioCueDispatcherNpcHandler"
vram = 0x8005CAF4
expect_asm = "lwc1 $f0, -0x5028($at)"
asm = "mtc1 $at, $f0"

# Player lifetime (cue owner == getPlayerField2()) 1.875 -> 3.75 (0x40700000).
[[patches.instruction]]
func = "audioCueDispatcherNpcHandler"
vram = 0x8005CB24
expect_asm = "lui $at, 0x8004"
asm = "lui $at, 0x4070"

[[patches.instruction]]
func = "audioCueDispatcherNpcHandler"
vram = 0x8005CB28
expect_asm = "lwc1 $f0, -0x5024($at)"
asm = "mtc1 $at, $f0"
