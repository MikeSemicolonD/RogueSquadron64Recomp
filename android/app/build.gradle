plugins {
    id 'com.android.application'
}

base { archivesName = 'RogueSquadron64Recomp' }

// The repo-root VERSION file is major.minor.patch, each part 0-99; versionCode packs it so a higher version always has a higher code.
def rs64Version = file("${rootDir}/../VERSION").text.trim()
def rs64VersionParts = rs64Version.tokenize('.').collect { it.toInteger() }
if (rs64VersionParts.size() != 3 || rs64VersionParts.any { it < 0 || it > 99 }) {
    throw new GradleException("VERSION must be major.minor.patch with each part 0-99, got '${rs64Version}'")
}
def rs64VersionCode = rs64VersionParts[0] * 10000 + rs64VersionParts[1] * 100 + rs64VersionParts[2]

// SDL's Java glue (org.libsdl.app.*) must match the SDL2 version CMakeLists.txt builds for Android.
def sdlVersion = '2.32.10'
def sdlArchive = layout.buildDirectory.file("sdl/SDL2-${sdlVersion}.tar.gz")
def sdlJavaDir = layout.buildDirectory.dir("generated/sdl-java")

// Host tools come from the Windows Debug build unless -Prs64FileToC / -Prs64N64Recomp / -Prs64RecompModTool name them (release CI builds Release).
// file_to_c embeds RT64's SPIR-V shaders when cross-compiling.
def hostFileToC = findProperty('rs64FileToC') ?: rootProject.file("../build/Debug/file_to_c.exe").absolutePath
// N64Recomp recompiles the patches ELF (MIPS GCC from MIPS_TOOLCHAIN_DIR's default, or -Prs64MipsDir).
def hostN64Recomp = findProperty('rs64N64Recomp') ?: rootProject.file("../build/Debug/N64Recomp.exe").absolutePath
// RecompModTool writes the multiplayer-native mod's mod.json and instruction_patches.json from its mod.toml.
def hostRecompModTool = findProperty('rs64RecompModTool') ?: rootProject.file("../build/Debug/RecompModTool.exe").absolutePath
def mipsDirArgs = findProperty('rs64MipsDir') ? ["-DMIPS_TOOLCHAIN_DIR=${findProperty('rs64MipsDir')}"] : []
// ccache on PATH caches native objects; base_dir and hash_dir=false let a new .cxx/<hash> folder reuse them.
def ccacheExe = providers.environmentVariable('PATH').getOrElse('').tokenize(File.pathSeparator).collectMany { [new File(it, 'ccache.exe'), new File(it, 'ccache')] }.find { it.isFile() }
def ccacheLauncher = ccacheExe ? "${ccacheExe.absolutePath.replace('\\', '/')};base_dir=${rootProject.file('..').absolutePath.replace('\\', '/')};hash_dir=false" : null
def ccacheArgs = ccacheLauncher ? ["-DCMAKE_C_COMPILER_LAUNCHER=${ccacheLauncher}", "-DCMAKE_CXX_COMPILER_LAUNCHER=${ccacheLauncher}"] : []

// Task actions must not touch `project` at execution time (Gradle 9), so file ops come from injected services.
interface FileOps {
    @javax.inject.Inject FileSystemOperations getFs()
    @javax.inject.Inject ArchiveOperations getArchives()
}
def fileOps = objects.newInstance(FileOps)

tasks.register('fetchSdlJava') {
    outputs.dir(sdlJavaDir)
    doLast {
        def archive = sdlArchive.get().asFile
        if (!archive.exists()) {
            archive.parentFile.mkdirs()
            new URL("https://github.com/libsdl-org/SDL/releases/download/release-${sdlVersion}/SDL2-${sdlVersion}.tar.gz").withInputStream { i -> archive.withOutputStream { it << i } }
        }
        fileOps.fs.copy {
            from(fileOps.archives.tarTree(fileOps.archives.gzip(archive))) {
                include "SDL2-${sdlVersion}/android-project/app/src/main/java/org/libsdl/app/*.java"
                eachFile { it.path = "org/libsdl/app/${it.name}" }
                includeEmptyDirs = false
            }
            into sdlJavaDir
        }
    }
}

// Third-party notices ship in the APK's assets: NOTICES.txt and licenses/.
def noticesDir = layout.buildDirectory.dir("generated/notices")
def noticesFile = rootProject.file('../NOTICES.txt')
def licensesDir = rootProject.file('../licenses')
tasks.register('bundleNotices') {
    inputs.file(noticesFile)
    inputs.dir(licensesDir)
    outputs.dir(noticesDir)
    doLast {
        fileOps.fs.sync {
            from(noticesFile)
            from(licensesDir) { into 'licenses' }
            into noticesDir
        }
    }
}

// The closed Discord Social SDK (from the Discord developer portal, never committed): with app/libs/discord_partner_sdk.aar present, the APK gets Discord status and the discord-status mod.
def discordAar = file('libs/discord_partner_sdk.aar')

// Mods bundled into the APK: the "android" list in mods/platforms.json (folders or built .nrm files). android_host.cpp installs them into <files>/mods on launch from assets/mods/index.txt.
// A mod the game's CMake builds (a native mod) comes from that build's finished folder, as desktop's tools/mods/stage_mods.cmake does; its .so is already packed with the game's libraries, so it is skipped.
abstract class BundleMods extends DefaultTask {
    @Internal abstract DirectoryProperty getModsRoot()
    @Internal abstract DirectoryProperty getBuiltMods()
    @Input abstract ListProperty<String> getExtraMods()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void bundle() {
        def root = modsRoot.get().asFile
        def builtRoot = builtMods.get().asFile
        def out = outputDir.get().asFile
        out.deleteDir()
        def lines = []
        def put = { File f, String rel ->
            def dst = new File(out, 'mods/' + rel)
            dst.parentFile.mkdirs()
            java.nio.file.Files.copy(f.toPath(), dst.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            lines << rel
        }
        (new groovy.json.JsonSlurper().parse(new File(root, 'platforms.json')).android + extraMods.get()).each { String name ->
            File built = null
            if (builtRoot.isDirectory()) {
                builtRoot.eachDir { cfg -> if (new File(cfg, name).isDirectory()) built = new File(cfg, name) }
            }
            def src = built ?: new File(root, name)
            if (src.isFile()) {
                put(src, name)
            } else if (src.isDirectory()) {
                src.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                    if (built == null || !f.name.endsWith('.so')) {
                        put(f, name + '/' + src.toPath().relativize(f.toPath()).toString().replace('\\', '/'))
                    }
                }
            } else {
                throw new GradleException("mods/platforms.json lists '${name}' for android, but mods/${name} does not exist (code mods must be built first)")
            }
        }
        new File(out, 'mods/index.txt').text = lines.join('\n') + '\n'
    }
}

// One per variant, after that variant's native build (which assembles the native mods' folders under build/built_mods/<variant>).
androidComponents {
    onVariants(selector().all()) { variant ->
        def suffix = variant.name.capitalize()
        def bundle = tasks.register("bundleMods${suffix}", BundleMods) {
            modsRoot.set(rootProject.file('../mods'))
            builtMods.set(layout.buildDirectory.dir("built_mods/${variant.name}"))
            extraMods.set(discordAar.exists() ? ['discord-status'] : [])
            dependsOn "externalNativeBuild${suffix}"
            doNotTrackState('Reads mods/ and the native build output; cheap to rerun')
        }
        variant.sources.assets?.addGeneratedSourceDirectory(bundle, { it.outputDir })
    }
}

android {
    namespace = 'com.rs64recomp.app'
    compileSdk 34
    ndkVersion = '29.0.14206865'

    defaultConfig {
        applicationId 'com.rs64recomp.app'
        // Android 9: the first release whose Vulkan loader exposes 1.1, which RT64 needs (devices without a 1.1 driver get the startup error).
        minSdk 28
        targetSdk 34
        versionCode rs64VersionCode
        versionName rs64Version
        ndk {
            // -Prs64Abis=x86_64 builds for the x86_64 emulator; phones and releases use arm64-v8a.
            abiFilters(*(findProperty('rs64Abis') ?: 'arm64-v8a').split(','))
        }
        externalNativeBuild {
            cmake {
                // Multiplayer ships as the multiplayer-native mod, as on desktop: libmultiplayer_native.so is packed with the game's libraries.
                arguments('-DANDROID_STL=c++_shared', "-DRT64_HOST_FILE_TO_C=${hostFileToC}", "-DN64RECOMP_EXE=${hostN64Recomp}", "-DRECOMP_MOD_TOOL=${hostRecompModTool}", *mipsDirArgs, *ccacheArgs)
                targets(*(['RogueSquadron64Recomp', 'SDL2', 'multiplayer_native'] + (discordAar.exists() ? ['discord_bridge'] : [])))
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
        }
    }

    sourceSets {
        main {
            java.srcDirs += sdlJavaDir
            assets.srcDirs += noticesDir
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DRS64_BUILT_MODS_DIR=${layout.buildDirectory.dir('built_mods/debug').get().asFile}"
                }
            }
        }
        release {
            minifyEnabled false
            signingConfig = signingConfigs.debug
            externalNativeBuild {
                cmake {
                    // Release, not AGP's default RelWithDebInfo: no -g, so compiles and links are faster.
                    arguments '-DCMAKE_BUILD_TYPE=Release', "-DRS64_BUILT_MODS_DIR=${layout.buildDirectory.dir('built_mods/release').get().asFile}"
                }
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        prefab = discordAar.exists()
    }
}

if (discordAar.exists()) {
    dependencies {
        implementation files(discordAar)
        implementation 'androidx.browser:browser:1.8.0'
    }
}

tasks.named('preBuild') {
    dependsOn 'fetchSdlJava', 'bundleNotices'
}
